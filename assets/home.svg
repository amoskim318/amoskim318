    <circle cx="2170" cy="150" r="5"/>
    <circle cx="220" cy="770" r="5"/>
    <circle cx="2180" cy="770" r="5"/>
  </g>

  <g transform="translate(1200 260)" fill="none" stroke="url(#gold)" filter="url(#glow)">
    <path d="M0 -105L95 -65V10C95 78 48 120 0 145C-48 120 -95 78 -95 10V-65Z" stroke-width="5"/>
    <path d="M0 -68L58 -43V10C58 51 32 79 0 98C-32 79 -58 51 -58 10V-43Z" stroke-width="3" opacity=".75"/>
    <path d="M-29 3L-7 25L35 -24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="1200" y="520" fill="#f4e7c8" font-size="104" font-weight="700" letter-spacing="5">AMOS KIMUNYA</text>
    <rect x="650" y="557" width="1100" height="4" rx="2" fill="url(#gold)"/>
    <text x="1200" y="640" fill="url(#gold)" font-size="54" font-weight="600" letter-spacing="13">JUNIOR CYBERSECURITY</text>
    <text x="1200" y="705" fill="#aab4b2" font-size="25" letter-spacing="6">NETWORK SECURITY • HANDS-ON LABS • DEFENSIVE SECURITY</text>
  </g>

  <g font-family="monospace" font-size="18" fill="#c49a50" opacity=".8">
