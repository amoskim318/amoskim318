
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 960" width="2400" height="960" role="img" aria-label="Amos Kimunya Junior Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11191b"/>
      <stop offset="55%" stop-color="#080d0f"/>
      <stop offset="100%" stop-color="#17140d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b6c22"/>
      <stop offset="50%" stop-color="#f5d58a"/>
      <stop offset="100%" stop-color="#b17a28"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#b58a43" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2400" height="960" fill="url(#bg)"/>
  <rect width="2400" height="960" fill="url(#grid)"/>

  <g fill="none" stroke="#c69a4c" stroke-width="2" opacity=".65">
