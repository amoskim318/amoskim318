  <path d="M90 825H2310" stroke="#b58a43" stroke-opacity=".4" stroke-width="2"/>
  <text x="1200" y="875" fill="#788583" font-family="monospace" font-size="18" text-anchor="middle" letter-spacing="4">LEARN • TEST • DOCUMENT • HARDEN</text>
